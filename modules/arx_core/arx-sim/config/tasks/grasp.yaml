task_layout:
  description: Locked grasp demo asset with red cube, blue cylinder, green sphere, and plate.
  # With the default arm-home pose, raise the right wrist camera to the previous
  # head-camera world height (~0.795 m). Both cameras move with the lift; the
  # reference is the head height before raising it. Applies only to --task grasp.
  initial_joint_positions:
    joint4: 0.339

simulation:
  # Match the deployed grasp_demo asset pose so scene cameras and the robot start
  # in the same location as the previously validated server setup.
  robot_pose:
    position: [4.3, 2.85, 0.01]
    orientation_wxyz: [0.70710678, 0.0, 0.0, -0.70710678]
  task_overlay: ../../../../asset/tasks/grasp_demo/1.0.0/task.usda

objects:
  red_cube:
    position: [4.12, 1.93, 0.715]
    size_m: 0.04
    mass_kg: 0.03
  blue_cylinder:
    position: [4.33, 1.79, 0.725]
    radius_m: 0.03
    height_m: 0.07
    mass_kg: 0.05
  green_sphere:
    position: [4.46, 1.96, 0.725]
    radius_m: 0.035
    mass_kg: 0.05
  plate:
    position: [4.25, 2.03, 0.686]
    radius_m: 0.065
