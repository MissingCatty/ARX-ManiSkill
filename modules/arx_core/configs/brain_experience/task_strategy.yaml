- id: stop_when_centered_after_reobserve
  title: 重新观测确认居中后立即停止转向
  description: 在目标对中任务中，每次底盘旋转后应先重新观测目标是否已回到图像中心；一旦最新观测显示目标已居中，就停止继续转向。该结论强调以最新观测为准，不应基于先前偏移继续微调。
  tags:
