- id: pink_cuboid_refresh_observation_after_segmentation_failure_1
  title: 首次 point 分割失败后，改用最新图像重新观测再分割
  description: 在一次成功样本中，首次带 point 的目标分割失败后，没有继续沿用旧 point；随后改为使用最新图像重新获取目标的结构化观测，并成功完成目标分割与深度测距。该经验强调：当首次点提示失效时，应优先重观测、重分割，再决定后续对中或接近动作。
